# Server Configuration
server.port=8084

# Application Name
spring.application.name=payment-service

# Database Configuration (PostgreSQL)
# Database is auto-created on startup if missing (see PostgresDatabaseCreator)
spring.datasource.url=jdbc:postgresql://localhost:5432/payment_db
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:reddi2273}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# =========================
# Razorpay Configuration
# =========================
# Get your keys from: https://dashboard.razorpay.com/app/keys
# For testing, use test keys from Razorpay dashboard
razorpay.key.id=rzp_test_RlckMDrutanqWY
razorpay.key.secret=pSu2rnKpY30PdJ27Osis7Lc8
razorpay.mode=TEST  # TEST or PRODUCTION

# =========================
# Platform Fee Configuration
# =========================
# Platform commission percentage (e.g., 10.0 = 10%)
payment.platform.fee.percentage=10.0

# Currency
payment.currency=INR

# Withdrawal Configuration
withdrawal.minimum.amount=100.0

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=localhost
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Feign Client Configuration
feign.client.config.default.connect-timeout=5000
feign.client.config.default.read-timeout=10000

# Logging Configuration
logging.level.com.ridesharing.paymentservice=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Application Info
info.app.name=Smart Ride Sharing System - Payment Service
info.app.description=Payment Processing and Wallet Management Service
info.app.version=1.0.0

# Configure static resource handling to only serve from /static/** and not from /api/**
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/static/**