# Server Configuration
server.port=8084

# Application Name
spring.application.name=payment-service

# Database Configuration (PostgreSQL / Neon)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/payment_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:reddi2273}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Razorpay Configuration
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_RlckMDrutanqWY}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:pSu2rnKpY30PdJ27Osis7Lc8}
razorpay.mode=${RAZORPAY_MODE:TEST}

# Platform Fee Configuration
payment.platform.fee.percentage=10.0
payment.currency=INR
withdrawal.minimum.amount=100.0

# Eureka Client Configuration
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=${EUREKA_INSTANCE_PREFER_IP_ADDRESS:false}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Feign Client Configuration
feign.client.config.default.connect-timeout=5000
feign.client.config.default.read-timeout=10000

# Logging Configuration
logging.level.com.ridesharing.paymentservice=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Application Info
info.app.name=Smart Ride Sharing System - Payment Service
info.app.description=Payment Processing and Wallet Management Service
info.app.version=1.0.0

# Configure static resource handling to only serve from /static/** and not from /api/**
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/static/**
