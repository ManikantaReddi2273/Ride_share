# Server Configuration (Render sets PORT)
server.port=${PORT:8082}
server.forward-headers-strategy=framework

# Application Name
spring.application.name=ride-service

# Database Configuration (PostgreSQL / Neon)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ride_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:reddi2273}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Maps API Configuration (OpenRouteService)
google.maps.api.key=${GOOGLE_MAPS_API_KEY:eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6IjlmOGQyMjllNjYwODQ0ZWI4ZTg0YjM2ZGUwNDY4YWQzIiwiaCI6Im11cm11cjY0In0=}
google.maps.distance-matrix.url=${GOOGLE_MAPS_DISTANCE_MATRIX_URL:https://api.openrouteservice.org/v2/directions/driving-car}

# Fare Calculation Settings
fare.base-fare=50.0
fare.rate-per-km=10.0
fare.currency=INR

# Eureka Client Configuration
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=${EUREKA_INSTANCE_PREFER_IP_ADDRESS:false}
eureka.instance.hostname=${RENDER_EXTERNAL_HOSTNAME:${EUREKA_INSTANCE_HOSTNAME:localhost}}
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.non-secure-port-enabled=${EUREKA_NON_SECURE_PORT_ENABLED:true}
eureka.instance.secure-port-enabled=${EUREKA_SECURE_PORT_ENABLED:false}
eureka.instance.secure-port=${EUREKA_INSTANCE_SECURE_PORT:443}

# Feign Client Configuration
feign.client.config.default.connect-timeout=15000
feign.client.config.default.read-timeout=60000

# Logging Configuration
logging.level.com.ridesharing.rideservice=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Application Info
info.app.name=Smart Ride Sharing System - Ride Service
info.app.description=Ride Posting, Searching, and Booking Service
info.app.version=1.0.0

# Email Configuration
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:campusworks2273@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:nlbdkysxhffrjwnt}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8

# Route Matching Configuration
route.matching.max-distance-meters=75000
route.matching.max-distance-km=50.0
route.matching.synthetic-waypoints=15

# WebSocket Configuration
spring.websocket.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Ride Reminder Configuration
ride.reminder.hours-before=2
ride.reminder.enabled=true

# Configure static resource handling to only serve from /static/** and not from /api/**
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/static/**
