# Server Configuration (Render sets PORT)
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Application Name
spring.application.name=api-gateway-service

# Force reactive web application type for Spring Cloud Gateway
spring.main.web-application-type=reactive

# Eureka Client Configuration
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=${EUREKA_INSTANCE_PREFER_IP_ADDRESS:false}
eureka.instance.hostname=${RENDER_EXTERNAL_HOSTNAME:${EUREKA_INSTANCE_HOSTNAME:localhost}}
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.non-secure-port-enabled=${EUREKA_NON_SECURE_PORT_ENABLED:true}
eureka.instance.secure-port-enabled=${EUREKA_SECURE_PORT_ENABLED:false}
eureka.instance.secure-port=${EUREKA_INSTANCE_SECURE_PORT:443}

# JWT Configuration
jwt.secret=${JWT_SECRET:SmartRideSharingSystemSecretKeyForJWTTokenGeneration2024}

# Gateway Configuration
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Gateway HTTP Client Configuration
# Render free tier cold-starts often take 60–120s; keep timeouts high enough to wait.
spring.cloud.gateway.httpclient.connect-timeout=${GATEWAY_CONNECT_TIMEOUT_MS:15000}
spring.cloud.gateway.httpclient.response-timeout=${GATEWAY_RESPONSE_TIMEOUT:120s}
spring.cloud.gateway.httpclient.pool.type=elastic
spring.cloud.gateway.httpclient.pool.max-connections=500
spring.cloud.gateway.httpclient.pool.max-idle-time=30000

# Logging Configuration
logging.level.com.ridesharing.apigateway=INFO
logging.level.org.springframework.cloud.gateway=INFO
logging.level.org.springframework.web=INFO

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,gateway
management.endpoint.health.show-details=when-authorized

# Application Info
info.app.name=Smart Ride Sharing System - API Gateway
info.app.description=Single entry point for all client requests
info.app.version=1.0.0

# CORS Configuration (used by CorsHeaderWebFilter + SecurityConfig)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Optional direct upstream URIs (set on Render to https://user-service-….onrender.com etc.)
gateway.user-service-uri=${GATEWAY_USER_SERVICE_URI:lb://user-service}
gateway.ride-service-uri=${GATEWAY_RIDE_SERVICE_URI:lb://ride-service}
gateway.payment-service-uri=${GATEWAY_PAYMENT_SERVICE_URI:lb://payment-service}
