# Server Configuration (Render sets PORT)
server.port=${PORT:8081}
server.forward-headers-strategy=framework

# Application Name
spring.application.name=user-service

# Database Configuration (PostgreSQL / Neon)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/user_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:reddi2273}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Eureka Client Configuration
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=${EUREKA_INSTANCE_PREFER_IP_ADDRESS:false}
eureka.instance.hostname=${RENDER_EXTERNAL_HOSTNAME:${EUREKA_INSTANCE_HOSTNAME:localhost}}
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.non-secure-port-enabled=${EUREKA_NON_SECURE_PORT_ENABLED:true}
eureka.instance.secure-port-enabled=${EUREKA_SECURE_PORT_ENABLED:false}
eureka.instance.secure-port=${EUREKA_INSTANCE_SECURE_PORT:443}

# JWT Configuration
jwt.secret=${JWT_SECRET:SmartRideSharingSystemSecretKeyForJWTTokenGeneration2024}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Logging Configuration
logging.level.com.ridesharing.userservice=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Application Info
info.app.name=Smart Ride Sharing System - User Service
info.app.description=User Management and Authentication Service
info.app.version=1.0.0

# Email Configuration
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:campusworks2273@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:nlbd kysx hffr jwnt}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8

# When SMTP/Resend fails (Render free blocks SMTP), still return OTP in API so users can verify
app.otp.reveal-on-mail-failure=${OTP_REVEAL_ON_MAIL_FAILURE:true}

# Optional: Resend.com HTTPS email (works on Render). Get key at https://resend.com
resend.api-key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:Smart Ride Sharing <onboarding@resend.dev>}

# Configure static resource handling to only serve from /static/** and not from /api/**
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/static/**
